name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Kein sample_data/ im Repo (personenbezogene Rohdaten, siehe
      # .gitignore) -> die End-to-End-Fixtures in tests/conftest.py
      # überspringen sich in CI automatisch (pytest.skip). Reine
      # Unit-/Synthetik-Tests (test_utils.py, test_bsp_activation.py)
      # laufen trotzdem immer.
      - name: Install package (dev extra)
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v
